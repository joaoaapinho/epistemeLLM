[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "episteme"
version = "0.1.0"
description = "Evidence-conditional belief revision via QLoRA + ORPO"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "episteme" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
